<body class="bg-gray-100 min-h-screen p-3 md:p-6 text-gray-800">

        <div class="text-center border-b pb-4 mb-6">

            <p class="text-sm text-gray-500 font-medium">Sistema de Control y Registro de Pedidos</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            
            <div>
                <label for="selectZona" class="block text-sm font-bold text-red-600 mb-1">
                    <i class="fa-solid fa-location-dot"></i> Seleccionar Zona / Departamento:
                </label>
                <select id="selectZona" onchange="cargarClientesPorZona()" class="w-full p-3 rounded-lg border-2 border-red-500 custom-red-select focus:outline-none shadow-sm cursor-pointer">
                    <option value="">-- Seleccione Zona --</option>
                    <option value="San Salvador">SAN SALVADOR</option>
                    <option value="San Vicente">SAN VICENTE</option>
                    <option value="Sonsonate">SONSONATE</option>
                </select>
            </div>

            <div>
                <label for="selectCliente" class="block text-sm font-bold text-gray-700 mb-1">
                    <i class="fa-solid fa-user"></i> Cliente:
                </label>
                <select id="selectCliente" class="w-full p-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-red-500 focus:outline-none shadow-sm">
                    <option value="">-- Seleccione primero una zona --</option>
                </select>
            </div>
        </div>

        <div class="overflow-x-auto mb-4">
            <table class="w-full text-left border-collapse" id="tablaPedido">
                <thead>
                    <tr class="bg-gray-800 text-white text-xs md:text-sm">
                        <th class="p-2 md:p-3 w-2/12">Código</th>
                        <th class="p-2 md:p-3 w-4/12">Producto / Descripción</th>
                        <th class="p-2 md:p-3 w-2/12 text-center">Cantidad</th>
                        <th class="p-2 md:p-3 w-3/12">Observaciones</th>
                        <th class="p-2 md:p-3 text-center w-1/12">Acción</th>
                    </tr>
                </thead>
                <tbody id="cuerpoTabla">
                </tbody>
            </table>
        </div>

        <div class="mb-8">
            <button type="button" onclick="agregarFila()" class="w-full md:w-auto bg-green-600 hover:bg-green-700 text-white px-5 py-2.5 rounded-lg font-semibold text-sm transition-colors duration-200 flex items-center justify-center gap-2 shadow">
                <i class="fa-solid fa-plus"></i> Agregar Casilla / Producto
            </button>
        </div>

        <div class="border-t pt-6 flex flex-col md:flex-row justify-between items-center gap-3">
            
            <button type="button" onclick="limpiarFormulario()" class="w-full md:w-auto bg-gray-500 hover:bg-gray-600 text-white px-5 py-2.5 rounded-lg font-semibold text-sm transition-colors duration-200 flex items-center justify-center gap-2 shadow">
                <i class="fa-solid fa-trash-can"></i> Limpiar Todo
            </button>

            <div class="w-full md:w-auto flex flex-wrap gap-2 justify-end">
                <button type="button" onclick="exportarExcel()" class="flex-1 md:flex-none bg-emerald-700 hover:bg-emerald-800 text-white px-3 py-2.5 rounded-lg text-sm font-semibold flex items-center justify-center gap-2 shadow">
                    <i class="fa-solid fa-file-excel"></i> Excel
                </button>
                <button type="button" onclick="exportarPDF()" class="flex-1 md:flex-none bg-red-700 hover:bg-red-800 text-white px-3 py-2.5 rounded-lg text-sm font-semibold flex items-center justify-center gap-2 shadow">
                    <i class="fa-solid fa-file-pdf"></i> PDF
                </button>
                <button type="button" onclick="exportarWord()" class="flex-1 md:flex-none bg-blue-700 hover:bg-blue-800 text-white px-3 py-2.5 rounded-lg text-sm font-semibold flex items-center justify-center gap-2 shadow">
                    <i class="fa-solid fa-file-word"></i> Word
                </button>
                <button type="button" onclick="exportarTXT()" class="flex-1 md:flex-none bg-gray-700 hover:bg-gray-800 text-white px-3 py-2.5 rounded-lg text-sm font-semibold flex items-center justify-center gap-2 shadow">
                    <i class="fa-solid fa-file-lines"></i> Bloc de Notas
                </button>
            </div>
        </div>

        // Cargar Clientes según la Zona elegida
        function cargarClientesPorZona() {
            const zonaSelect = document.getElementById("selectZona").value;
            const clienteSelect = document.getElementById("selectCliente");
            
            clienteSelect.innerHTML = '<option value="">-- Seleccione Cliente --</option>';

            if (zonaSelect && clientesPorZona[zonaSelect]) {
                clientesPorZona[zonaSelect].forEach(cliente => {
                    const opt = document.createElement("option");
                    opt.value = cliente;
                    opt.textContent = cliente;
                    clienteSelect.appendChild(opt);
                });
            }
        }

        // Agregar Fila a la Tabla
        function agregarFila() {
            const tbody = document.getElementById("cuerpoTabla");
            const tr = document.createElement("tr");
            tr.className = "border-b hover:bg-gray-50 text-sm";

            tr.innerHTML = `
                <td class="p-2">
                    <input type="text" placeholder="Ej: QUI009" oninput="autocompletarProducto(this)" 
                        class="w-full p-2 border rounded uppercase focus:ring-1 focus:ring-red-500 text-xs md:text-sm">
                </td>
                <td class="p-2">
                    <input type="text" placeholder="Nombre del producto" readonly 
                        class="nombre-prod w-full p-2 bg-gray-100 border rounded text-xs md:text-sm font-medium text-gray-700">
                </td>
                <td class="p-2">
                    <input type="number" min="1" value="1" placeholder="Cant." 
                        class="w-full p-2 border rounded focus:ring-1 focus:ring-red-500 text-xs md:text-sm text-center">
                </td>
                <td class="p-2">
                    <input type="text" placeholder="Opcional..." 
                        class="w-full p-2 border rounded focus:ring-1 focus:ring-red-500 text-xs md:text-sm">
                </td>
                <td class="p-2 text-center">
                    <button type="button" onclick="eliminarFila(this)" class="text-red-500 hover:text-red-700 px-2 py-1">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </td>
            `;

            tbody.appendChild(tr);
        }

        // Autocompletar Descripción por Código
        function autocompletarProducto(inputCodigo) {
            const codigo = inputCodigo.value.trim().toUpperCase();
            const fila = inputCodigo.closest("tr");
            const inputNombre = fila.querySelector(".nombre-prod");

            if (productos[codigo]) {
                inputNombre.value = productos[codigo];
            } else {
                inputNombre.value = "";
            }
        }

        // Eliminar Fila
        function eliminarFila(btn) {
            btn.closest("tr").remove();
        }

        // Limpiar Formulario Completo
        function limpiarFormulario() {
            document.getElementById("selectZona").value = "";
            document.getElementById("selectCliente").innerHTML = '<option value="">-- Seleccione primero una zona --</option>';
            document.getElementById("cuerpoTabla").innerHTML = "";
            agregarFila();
        }

        // Obtener Datos para Exportación
        function obtenerDatosTabla() {
            const zona = document.getElementById("selectZona").value;
            const cliente = document.getElementById("selectCliente").value;
            const filas = document.querySelectorAll("#cuerpoTabla tr");
            
            let items = [];
            filas.forEach(fila => {
                const inputs = fila.querySelectorAll("input");
                const codigo = inputs[0].value.trim();
                const descripcion = inputs[1].value.trim();
                const cantidad = inputs[2].value.trim();
                const observaciones = inputs[3].value.trim();

                if (codigo || descripcion) {
                    items.push([codigo, descripcion, cantidad, observaciones]);
                }
            });

            return { zona, cliente, items };
        }

        // Exportar a Excel
        function exportarExcel() {
            const { zona, cliente, items } = obtenerDatosTabla();
            if (!cliente) { alert("Por favor seleccione un cliente."); return; }

            const data = [
                ["FROZCA, SA DE CV"],
                ["Zona / Depto:", zona],
                ["Cliente:", cliente],
                [],
                ["Código", "Descripción", "Cantidad", "Observaciones"]
            ];

            items.forEach(item => data.push(item));

            const ws = XLSX.utils.aoa_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Pedido");
            XLSX.writeFile(wb, `Pedido_${cliente}.xlsx`);
        }

        // Exportar a PDF
        function exportarPDF() {
            const { jsPDF } = window.jspdf;
            const { zona, cliente, items } = obtenerDatosTabla();
            if (!cliente) { alert("Por favor seleccione un cliente."); return; }

            const doc = new jsPDF();
            doc.setFontSize(16);
            doc.text("FROZCA, SA DE CV", 14, 15);
            doc.setFontSize(11);
            doc.text(`Zona / Depto: ${zona}`, 14, 23);
            doc.text(`Cliente: ${cliente}`, 14, 29);

            doc.autoTable({
                startY: 35,
                head: [['Código', 'Descripción del Producto', 'Cantidad', 'Observaciones']],
                body: items,
                headStyles: { fillColor: [220, 38, 38] }
            });

            doc.save(`Pedido_${cliente}.pdf`);
        }

        // Exportar a Word
        function exportarWord() {
            const { zona, cliente, items } = obtenerDatosTabla();
            if (!cliente) { alert("Por favor seleccione un cliente."); return; }

            let contenido = `
                <h2 style="text-align:center;">FROZCA, SA DE CV</h2>
                <p><b>Zona / Depto:</b> ${zona}</p>
                <p><b>Cliente:</b> ${cliente}</p>
                <table border="1" style="border-collapse:collapse; width:100%;">
                    <tr style="background:#dc2626; color:white;">
                        <th>Código</th><th>Descripción</th><th>Cantidad</th><th>Observaciones</th>
                    </tr>
            `;

            items.forEach(item => {
                contenido += `<tr><td>${item[0]}</td><td>${item[1]}</td><td>${item[2]}</td><td>${item[3]}</td></tr>`;
            });

            contenido += "</table>";

            const blob = new Blob(['\ufeff' + contenido], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Pedido_${cliente}.doc`;
            a.click();
        }

        // Exportar a Bloc de Notas (.txt)
        function exportarTXT() {
            const { zona, cliente, items } = obtenerDatosTabla();
            if (!cliente) { alert("Por favor seleccione un cliente."); return; }

            let texto = `========================================\n`;
            texto += `           FROZCA, SA DE CV             \n`;
            texto += `========================================\n`;
            texto += `Zona / Depto: ${zona}\n`;
            texto += `Cliente     : ${cliente}\n`;
            texto += `========================================\n\n`;
            texto += `DETALLE DEL PEDIDO:\n`;
            texto += `----------------------------------------\n`;

            items.forEach((item, index) => {
                texto += `${index + 1}. [${item[0]}] ${item[1]}\n`;
                texto += `   Cantidad: ${item[2]}\n`;
                if (item[3]) {
                    texto += `   Observaciones: ${item[3]}\n`;
                }
                texto += `----------------------------------------\n`;
            });

            const blob = new Blob([texto], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Pedido_${cliente}.txt`;
            a.click();
        }

        window.onload = function() {
            agregarFila();
        };
    </script>
