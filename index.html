        // Cargar Clientes según la Zona elegida
        function cargarClientesPorZona() {
            const zonaSelect = document.getElementById("selectZona").value;
            const clienteSelect = document.getElementById("selectCliente");
            
            clienteSelect.innerHTML = '<option value="">-- Seleccione Cliente --</option>';

            if (zonaSelect && clientesPorZona[zonaSelect]) {
                clientesPorZona[zonaSelect].forEach(cliente => {
                    const opt = document.createElement("option");
                    opt.value = cliente;
                    opt.textContent = cliente;
                    clienteSelect.appendChild(opt);
                });
            }
        }

        // Agregar Fila Ilimitada a la Tabla
        function agregarFila() {
            const tbody = document.getElementById("cuerpoTabla");
            const tr = document.createElement("tr");
            tr.className = "border-b hover:bg-gray-50 text-sm";

            tr.innerHTML = `
                <td class="p-2">
                    <input type="text" placeholder="Ej: UNI016" oninput="autocompletarProducto(this)" 
                        class="w-full p-2 border rounded uppercase focus:ring-1 focus:ring-red-500 text-xs md:text-sm">
                </td>
                <td class="p-2">
                    <input type="text" placeholder="Nombre del producto" readonly 
                        class="nombre-prod w-full p-2 bg-gray-100 border rounded text-xs md:text-sm font-medium text-gray-700">
                </td>
                <td class="p-2">
                    <input type="number" min="1" value="1" placeholder="Cant." 
                        class="w-full p-2 border rounded focus:ring-1 focus:ring-red-500 text-xs md:text-sm text-center">
                </td>
                <td class="p-2">
                    <input type="text" placeholder="Opcional..." 
                        class="w-full p-2 border rounded focus:ring-1 focus:ring-red-500 text-xs md:text-sm">
                </td>
                <td class="p-2 text-center">
                    <button type="button" onclick="eliminarFila(this)" class="text-red-500 hover:text-red-700 px-2 py-1">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </td>
            `;

            tbody.appendChild(tr);
        }

        // Autocompletar Descripción por Código
        function autocompletarProducto(inputCodigo) {
            const codigo = inputCodigo.value.trim().toUpperCase();
            const fila = inputCodigo.closest("tr");
            const inputNombre = fila.querySelector(".nombre-prod");

            if (productos[codigo]) {
                inputNombre.value = productos[codigo];
            } else {
                inputNombre.value = "";
            }
        }

        // Eliminar Fila
        function eliminarFila(btn) {
            btn.closest("tr").remove();
        }

        // Limpiar Formulario Completo
        function limpiarFormulario() {
            document.getElementById("selectZona").value = "";
            document.getElementById("selectCliente").innerHTML = '<option value="">-- Seleccione primero una zona --</option>';
            document.getElementById("cuerpoTabla").innerHTML = "";
            agregarFila(); // Deja una fila vacía por defecto
        }

        // OBTENER DATOS PARA EXPORTACIÓN
        function obtenerDatosTabla() {
            const zona = document.getElementById("selectZona").value;
            const cliente = document.getElementById("selectCliente").value;
            const filas = document.querySelectorAll("#cuerpoTabla tr");
            
            let items = [];
            filas.forEach(fila => {
                const inputs = fila.querySelectorAll("input");
                const codigo = inputs[0].value.trim();
                const descripcion = inputs[1].value.trim();
                const cantidad = inputs[2].value.trim();
                const observaciones = inputs[3].value.trim();

                if (codigo || descripcion) {
                    items.push([codigo, descripcion, cantidad, observaciones]);
                }
            });

            return { zona, cliente, items };
        }

        // EXPORTAR A EXCEL
        function exportarExcel() {
            const { zona, cliente, items } = obtenerDatosTabla();
            if (!cliente) { alert("Por favor seleccione un cliente."); return; }

            const data = [
                ["FROZCA, SA DE CV"],
                ["Zona / Depto:", zona],
                ["Cliente:", cliente],
                [],
                ["Código", "Descripción", "Cantidad", "Observaciones"]
            ];

            items.forEach(item => data.push(item));

            const ws = XLSX.utils.aoa_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Pedido");
            XLSX.writeFile(wb, `Pedido_${cliente}.xlsx`);
        }

        // EXPORTAR A PDF
        function exportarPDF() {
            const { jsPDF } = window.jspdf;
            const { zona, cliente, items } = obtenerDatosTabla();
            if (!cliente) { alert("Por favor seleccione un cliente."); return; }

            const doc = new jsPDF();
            doc.setFontSize(16);
            doc.text("FROZCA, SA DE CV", 14, 15);
            doc.setFontSize(11);
            doc.text(`Zona / Depto: ${zona}`, 14, 23);
            doc.text(`Cliente: ${cliente}`, 14, 29);

            doc.autoTable({
                startY: 35,
                head: [['Código', 'Descripción del Producto', 'Cantidad', 'Observaciones']],
                body: items,
                headStyles: { fillColor: [220, 38, 38] }
            });

            doc.save(`Pedido_${cliente}.pdf`);
        }

        // EXPORTAR A WORD
        function exportarWord() {
            const { zona, cliente, items } = obtenerDatosTabla();
            if (!cliente) { alert("Por favor seleccione un cliente."); return; }

            let contenido = `
                <h2 style="text-align:center;">FROZCA, SA DE CV</h2>
                <p><b>Zona / Depto:</b> ${zona}</p>
                <p><b>Cliente:</b> ${cliente}</p>
                <table border="1" style="border-collapse:collapse; width:100%;">
                    <tr style="background:#dc2626; color:white;">
                        <th>Código</th><th>Descripción</th><th>Cantidad</th><th>Observaciones</th>
                    </tr>
            `;

            items.forEach(item => {
                contenido += `<tr><td>${item[0]}</td><td>${item[1]}</td><td>${item[2]}</td><td>${item[3]}</td></tr>`;
            });

            contenido += "</table>";

            const blob = new Blob(['\ufeff' + contenido], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Pedido_${cliente}.doc`;
            a.click();
        }

        // EXPORTAR A BLOC DE NOTAS (.TXT)
        function exportarTXT() {
            const { zona, cliente, items } = obtenerDatosTabla();
            if (!cliente) { alert("Por favor seleccione un cliente."); return; }

            let texto = `========================================\n`;
            texto += `           FROZCA, SA DE CV             \n`;
            texto += `========================================\n`;
            texto += `Zona / Depto: ${zona}\n`;
            texto += `Cliente     : ${cliente}\n`;
            texto += `========================================\n\n`;
            texto += `DETALLE DEL PEDIDO:\n`;
            texto += `----------------------------------------\n`;

            items.forEach((item, index) => {
                texto += `${index + 1}. [${item[0]}] ${item[1]}\n`;
                texto += `   Cantidad: ${item[2]}\n`;
                if (item[3]) {
                    texto += `   Observaciones: ${item[3]}\n`;
                }
                texto += `----------------------------------------\n`;
            });

            const blob = new Blob([texto], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Pedido_${cliente}.txt`;
            a.click();
        }

        // Inicializar con 1 fila por defecto al cargar
        window.onload = function() {
            agregarFila();
        };
